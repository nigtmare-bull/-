[package]
name = "traffic"
version = "0.1.0"
edition = "2021"

[dependencies]
smol = "2"
rusqlite = { version = "0.40.2", features = ["bundled", "functions", "time", "uuid"] }
async-sqlite = { version = "0.6.0", features = ["array", "backup", "blob", "bundled", "cache", "time", "uuid", "vtab", "window"] }
async-lock = "3.4.2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
